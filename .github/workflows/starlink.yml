	return '<span class="fws-inline" data-fws-live="updated">' . ( $d ? esc_html( fw_starlink_date_pl( $d['generated_at'] ) . ', ' . fw_starlink_hm( $d['generated_at'] ) ) : '' ) . '</span>';
} );

/* === ASSETY ======================================================== */

function fw_starlink_is_current() {
	if ( ! is_singular() ) { return false; }
	if ( FW_STARLINK_POST_ID ) { return (int) get_queried_object_id() === (int) FW_STARLINK_POST_ID; }
	$o = get_queried_object();
	return $o instanceof WP_Post && has_shortcode( (string) $o->post_content, 'fw_starlink_now' );
}
function fw_starlink_enqueue() {
	static $done = false;
	if ( $done ) { return; }
	$done = true;
	$d = fw_starlink_data();
	wp_enqueue_style( 'fw-starlink', fw_starlink_url() . '/starlink.css', array(), FW_STARLINK_VER );
	wp_enqueue_script( 'fw-starlink', fw_starlink_url() . '/starlink-engine.js', array(), FW_STARLINK_VER, true );
	$client = array(
		'data'        => $d ? $d : null,
		'src'         => FW_STARLINK_JSON_URL,
		'defaultCity' => FW_STARLINK_DEFAULT_CITY,
	);
	if ( $client['data'] ) { unset( $client['data']['log'] ); }
	wp_add_inline_script( 'fw-starlink', 'window.FW_STARLINK=' . wp_json_encode( $client, JSON_UNESCAPED_UNICODE ) . ';', 'before' );
}
add_action( 'wp_enqueue_scripts', function () {
	if ( fw_starlink_is_current() ) { fw_starlink_enqueue(); }
} );

/* === META (Yoast) ================================================== */
foreach ( array( 'wpseo_metadesc', 'wpseo_opengraph_desc', 'wpseo_twitter_description' ) as $fw_starlink_f ) {
	add_filter( $fw_starlink_f, function ( $t ) {
		return ( fw_starlink_is_current() && fw_starlink_data() ) ? fw_starlink_meta() : $t;
	}, 20 );
}

/* === CRON: co godzinę — świeże dane; gdy zmienił się stan, czyścimy cache wpisu ===
 * Podpis stanu = najbliższe pociągi w Poznaniu + lista startów. Bez zmian = bez czyszczenia. */
add_action( 'init', function () {
	if ( ! wp_next_scheduled( 'fw_starlink_hourly' ) ) {
		wp_schedule_event( time() + 300, 'hourly', 'fw_starlink_hourly' );
	}
} );
add_action( 'fw_starlink_hourly', function () {
	delete_transient( 'fw_starlink_fresh' );
	fw_starlink_fetch();
	$d = get_option( 'fw_starlink_last' );
	if ( ! fw_starlink_valid( $d ) ) { return; }
	$sig = array();
	foreach ( (array) $d['passes'][ FW_STARLINK_DEFAULT_CITY ] as $e ) { $sig[] = $e['start']; }
	foreach ( (array) $d['launches_upcoming'] as $l ) { $sig[] = $l['name'] . $l['net'] . $l['status']; }
	$sig = md5( implode( '|', $sig ) . '|' . wp_date( 'Ymd' ) );   // + data: „dziś/jutro” w tekście SEO
	if ( get_option( 'fw_starlink_sig' ) === $sig ) { return; }
	update_option( 'fw_starlink_sig', $sig, false );
	if ( FW_STARLINK_POST_ID ) {
		wp_update_post( array( 'ID' => (int) FW_STARLINK_POST_ID ) );       // świeża data „Aktualizacja”
		if ( function_exists( 'rocket_clean_post' ) ) { rocket_clean_post( (int) FW_STARLINK_POST_ID ); }
	}
} );

/* === [fw_starlink_test] — diagnostyka ============================== */
add_shortcode( 'fw_starlink_test', function () {
	delete_transient( 'fw_starlink_fresh' );
	$d   = fw_starlink_data();
	$loc = fw_starlink_dir() . '/starlink.json';
	$ev  = fw_starlink_events( FW_STARLINK_DEFAULT_CITY );
	$rows = array(
		'Snippet wykonuje się'      => 'TAK (v' . FW_STARLINK_VER . ')',
		'Źródło JSON (URL)'         => FW_STARLINK_JSON_URL ? FW_STARLINK_JSON_URL : '(nieustawione)',
		'Plik zapasowy'             => file_exists( $loc ) ? 'TAK' : 'NIE',
		'Dane wygenerowane'         => $d ? $d['generated_at'] . ' (generator v' . $d['version'] . ')' : 'BRAK DANYCH',
		'Grup na orbicie'           => $d ? count( $d['groups'] ) : 0,
		'Starty nadchodzące'        => $d ? count( $d['launches_upcoming'] ) : 0,
		'Pociągi (Poznań, 7 dni)'   => count( $ev ),
		'Najbliższy (Poznań)'       => $ev ? fw_starlink_when( $ev[0]['start'] ) : '—',
		'Meta description'          => $d ? fw_starlink_meta() : '—',
		'ID tego wpisu'             => get_queried_object_id() . ( FW_STARLINK_POST_ID ? ' (FW_STARLINK_POST_ID = ' . FW_STARLINK_POST_ID . ')' : ' (FW_STARLINK_POST_ID nieustawione)' ),
		'Ten wpis rozpoznany'       => fw_starlink_is_current() ? 'TAK' : 'NIE — sprawdź, czy ID z wiersza wyżej = FW_STARLINK_POST_ID',
		'Katalog assetów'           => fw_starlink_url(),
	);
	$h = '<div style="border:2px solid #4a4a4a;padding:1em;margin:1em 0;font:14px/1.5 monospace">';
	$h .= '<strong>fw_starlink — autotest</strong><br>';
	foreach ( $rows as $k => $v ) { $h .= esc_html( $k ) . ': <strong>' . esc_html( (string) $v ) . '</strong><br>'; }
	return $h . '</div>';
} );
