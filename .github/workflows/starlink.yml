		$t = '<p class="fws-empty">W najbliższych 7 dniach nad Poznaniem nie przeleci w ciemności żaden świeży pociąg Starlink.</p>';
	} else {
		$t = '<div class="fws-list-wrap"><table class="fws-list"><caption>Widoczne pociągi Starlink · Poznań</caption><thead><tr>'
			. '<th scope="col">Kiedy</th><th scope="col">Skąd → dokąd</th><th scope="col">Najwyżej</th><th scope="col">Pociąg</th></tr></thead><tbody>';
		foreach ( $ev as $e ) {
			$t .= '<tr><td class="fws-nw"><strong>' . esc_html( fw_starlink_wd( $e['start'], true ) . ' ' . fw_starlink_dt( $e['start'] )->format( 'j.m' ) ) . '</strong>'
				. '<span class="fws-sub">' . esc_html( fw_starlink_hm( $e['start'] ) . '–' . fw_starlink_hm( $e['end'] ) ) . '</span></td>'
				. '<td class="fws-nw">' . esc_html( $e['from'] . ' → ' . $e['to'] ) . '</td>'
