# 2026-11-15 · v1.1 · starlink.yml
# v1.1: repo fwdpl/nlc; przed push „git pull --rebase” — robot obłoków srebrzystych zapisuje do tego
#       samego repo i równoczesny push mógłby zostać odrzucony.
# GitHub Actions: co 3 godziny liczy przeloty pociągów Starlink i zapisuje starlink/starlink.json.
# Plik wgrać do repozytorium jako: .github/workflows/starlink.yml
# Skrypt generatora: starlink/generate_starlink_data.py (w tym samym repozytorium).
# Blog czyta wynik z: https://cdn.jsdelivr.net/gh/fwdpl/nlc@main/starlink/starlink.json

name: starlink

on:
  schedule:
    - cron: "17 */3 * * *"      # co 3 h, 17 min po pełnej godzinie (UTC)
  workflow_dispatch: {}          # przycisk „Run workflow” do ręcznego uruchomienia

permissions:
  contents: write

concurrency:
  group: starlink
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Zależności
        run: pip install skyfield skyfield-data numpy

      - name: Generator
        working-directory: starlink
        run: python generate_starlink_data.py --prev starlink.json --out starlink.new.json

      - name: Zapis, jeśli dane są poprawne
        working-directory: starlink
        run: |
          python - <<'EOF'
          import json, sys
          d = json.load(open("starlink.new.json", encoding="utf-8"))
          ok = d.get("generated_at") and isinstance(d.get("passes"), dict) and len(d["passes"]) == 10
          sys.exit(0 if ok else 1)
          EOF
          mv starlink.new.json starlink.json

      - name: Commit
        run: |
          git config user.name "starlink-bot"
          git config user.email "actions@users.noreply.github.com"
          git add starlink/starlink.json
          git diff --cached --quiet && exit 0
          git commit -m "starlink: dane $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 10; done

      - name: Odśwież jsDelivr
        run: curl -s "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/starlink/starlink.json" || true
